name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install norminette
      - run: norminette *.c *.h

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FindingMiGo/libft
          path: libft-src

      - name: Copy libft
        run: |
          rm -rf libft
          cp -R libft-src libft

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build
        run: make

      - name: Compile test
        run: |
          cat <<'CEOF' > test_main.c
          #include "ft_printf.h"
          int main(void)
          {
            int n;
            n = ft_printf("hello %s %d %x %p\n", "world", 42, 255, (void *)0x1234);
            ft_printf("ret: %d\n", n);
            ft_printf("%d %i %u\n", -1, 0, 4294967295U);
            ft_printf("%%\n");
            ft_printf("%c\n", 'A');
            return (0);
          }
          CEOF
          gcc -Wall -Wextra -Werror test_main.c -L. -lftprintf -o test_printf

      - name: Valgrind leak check
        run: valgrind --leak-check=full --error-exitcode=1 ./test_printf
